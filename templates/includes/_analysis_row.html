{% load humanize %}
{% if analysis_articles %}
<section class="analysis-row">
  <div class="section-header">
    <h2 class="section-header-label">{{ analysis_label }}</h2>
    {% if analysis_view_all_category %}<a href="{{ analysis_view_all_category.get_absolute_url }}" class="section-header__view-all">View All →</a>{% endif %}
  </div>
  <div class="category-grid">
    {% for article in analysis_articles %}
    <a href="{{ article.get_absolute_url }}" class="news-card">
      <div class="news-card__media">
        {% if article.image %}
          <img src="{{ article.image.url }}" alt="{{ article.title }}">
        {% else %}
          <div class="media-placeholder media-placeholder--none"></div>
        {% endif %}
      </div>
      <h3 class="h4-list">{{ article.title }}</h3>
      <time class="meta" datetime="{{ article.published_at|date:'c' }}">{{ article.published_at|naturaltime }}</time>
    </a>
    {% endfor %}
  </div>
</section>
{% endif %}
