{% load humanize %}
{% if editors_picks %}
<section class="editors-picks">
  <div class="section-header section-header--brand">
    <h2 class="section-header-label">Editor's Picks</h2>
  </div>

  <div class="category-grid{% if editors_picks|length == 1 %} category-grid--1{% elif editors_picks|length == 2 %} category-grid--2{% elif editors_picks|length == 3 %} category-grid--3{% endif %}">
    {% for article in editors_picks %}
    <a href="{{ article.get_absolute_url }}" class="news-card">
      <div class="news-card__media">
        {% if article.image %}
          <img src="{{ article.image.url }}" alt="{{ article.title }}">
        {% else %}
          <div class="media-placeholder media-placeholder--none"></div>
        {% endif %}
      </div>
      <span class="kicker">{{ article.category.name }}</span>
      <h3 class="h4-list">{{ article.title }}</h3>
      <time class="meta" datetime="{{ article.published_at|date:'c' }}">{{ article.published_at|naturaltime }}</time>
    </a>
    {% endfor %}
  </div>
</section>
{% endif %}
